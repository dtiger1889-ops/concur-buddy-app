<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px "Segoe UI", sans-serif; width: 380px; margin: 0; padding: 10px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .exp { border: 1px solid #ccc; border-radius: 6px; padding: 6px 8px; margin: 6px 0; display: flex; align-items: center; gap: 8px; }
  .exp .who { flex: 1; min-width: 0; }
  .exp .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exp small { color: #555; }
  button { cursor: pointer; }
  #status { margin-top: 8px; white-space: pre-wrap; color: #333; background: #f5f5f5; border-radius: 6px; padding: 6px 8px; display: none; }
  #hint { color: #666; margin: 6px 0; }
</style>
</head>
<body>
  <h1>Concur Buddy Autofill <small id="ver" style="color:#888;font-weight:normal"></small></h1>
  <script src="selectors.js"></script>
  <div id="hint">Load the <b>staged_expenses.json</b> file from Concur Buddy (More ▾ → Export for Autofill…), open a New Expense form in Concur, then Fill.</div>
  <input type="file" id="file" accept=".json,application/json">
  <div id="list"></div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
